services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: server
    environment:
      TZ: Asia/Tokyo
      TT_DB_USERNAME: root
      TT_DB_PASSWORD: password
      TT_DB_HOSTNAME: mysql
      TT_DB_PORT: 3306
      TT_DB_NAME: ttblog
      TT_STORAGE_TYPE: composite
      TT_STORAGE_S3_BUCKET: ttblog
      TT_STORAGE_S3_REGION: ap-northeast-1
      TT_STORAGE_S3_ENDPOINT: http://s3:9000
      TT_STORAGE_S3_ACCESS_KEY: ROOT
      TT_STORAGE_S3_SECRET_KEY: PASSWORD
    tty: true
    volumes:
      - ./:/app/TT-Blog
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  mysql:
    image: mysql:9.2.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ttblog
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
    expose:
      - "3306"

  s3:
    image: minio/minio:latest
    # 9000-API, 9001-Web
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      default:
        aliases:
          - ttblog.s3
    environment:
      MINIO_ROOT_USER: ROOT
      MINIO_ROOT_PASSWORD: PASSWORD
      MINIO_DOMAIN: s3
    volumes:
      - ./s3:/data
    command: minio server /data --console-address :9001
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "4040:80"
    volumes:
      - ./phpmyadmin/sessions:/sessions

volumes:
  mysql:
  s3:
  phpmyadmin: